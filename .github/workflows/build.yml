name: Build All Platforms
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build-all:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libssl-dev
      - run: npm install
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build --bundles dmg
        env:
          CI: true
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: npx tauri build --bundles deb,rpm
        env:
          CI: true
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build --bundles msi
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: elidia-desktop-${{ runner.os }}
          path: src-tauri/target/release/bundle/
